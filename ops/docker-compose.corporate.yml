# Demiurge C4 corporate stack: Postgres (pgvector) + optional LDAP / Keycloak.
# Reuse the B5 collector / Grafana stack from docker-compose.observability.yml:
#
#   docker compose \
#     -f ops/docker-compose.observability.yml \
#     -f ops/docker-compose.corporate.yml \
#     up
#
# /readyz going green is a manual or CI-compose check — default unit CI
# does not start this file.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: demiurge
      POSTGRES_PASSWORD: demiurge
      POSTGRES_DB: demiurge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demiurge -d demiurge"]
      interval: 5s
      timeout: 5s
      retries: 10

  ldap:
    profiles: ["ldap"]
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Demiurge
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "389:389"
      - "636:636"

  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
